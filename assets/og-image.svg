<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="warm" cx="22%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1a1410" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0c0a09" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6C98A"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
    <pattern id="tile" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C9A96E" stroke-width="0.9" stroke-linecap="square" opacity="0.06">
        <path d="M60 0 L120 60 L60 120 L0 60 Z"/>
        <path d="M60 20 L100 60 L60 100 L20 60 Z"/>
        <path d="M60 40 L80 60 L60 80 L40 60 Z"/>
        <path d="M0 60 L120 60 M60 0 L60 120"/>
        <circle cx="60" cy="60" r="28"/>
        <circle cx="60" cy="60" r="14"/>
      </g>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#080808"/>
  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect width="1200" height="630" fill="url(#tile)"/>

  <!-- Top eyebrow -->
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="14" letter-spacing="3" fill="#C9A96E">
    <line x1="80" y1="98" x2="120" y2="98" stroke="#C9A96E" stroke-width="1"/>
    <text x="135" y="103">PORTFOLIO · 2026</text>
  </g>

  <!-- Top right meta -->
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" letter-spacing="2.5" fill="#8A7D6E" text-anchor="end">
    <text x="1120" y="103">RIYADH · SAUDI ARABIA</text>
  </g>

  <!-- Massive name -->
  <text x="80" y="320"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="220" font-weight="500"
        fill="url(#goldGrad)" letter-spacing="-6">Yousef</text>

  <!-- Surname caps -->
  <g>
    <line x1="80" y1="370" x2="160" y2="370" stroke="#C9A96E" stroke-width="1"/>
    <text x="180" y="377"
          font-family="ui-monospace, 'JetBrains Mono', monospace"
          font-size="22" letter-spacing="9"
          fill="#F2EDE6">ALSHUWAYI</text>
  </g>

  <!-- Roles row -->
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="16" letter-spacing="3" fill="#8A7D6E">
    <text x="80" y="438">FOUNDER</text>
    <text x="220" y="438" fill="#C9A96E">·</text>
    <text x="240" y="438">AGENTIC AI ENGINEER</text>
    <text x="528" y="438" fill="#C9A96E">·</text>
    <text x="548" y="438">FULL-STACK DEVELOPER</text>
  </g>

  <!-- Tagline -->
  <g font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#F2EDE6">
    <text x="80" y="512" font-style="italic">AI, the right tools, and an engineering mindset.</text>
    <text x="80" y="554" font-style="italic"><tspan fill="#C9A96E">That's how</tspan> the next generation of work gets built — disciplined, not random.</text>
  </g>

  <!-- Bottom band -->
  <line x1="80" y1="588" x2="1120" y2="588" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="12" letter-spacing="3" fill="#8A7D6E">
    <text x="80" y="608">GHRS · RUSOKH · REPLYLI</text>
    <text x="1120" y="608" text-anchor="end">YOUSEFALSHUWAYI.ONLINE</text>
  </g>
</svg>
